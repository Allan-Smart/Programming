<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukraine Flag</title>
    <style>
        /* Parent container: Set base size and relative context */
        .flag {
            width: 900px;
            height: 600px;
            position: relative;
            font-family: sans-serif;
            font-size: 2rem;
        }

        /* Top text: Positioned absolutely over the blue half */
        .top-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            margin: 0;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2; /* Sits on top of the blue background */
        }

        /* Child: Top blue stripe filling the upper 50% */
        .blue-stripe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: #005787;
        }

        /* Grandchild: Pushed exactly 100% down relative to its blue parent */
        .yellow-stripe {
            position: absolute;
            top: 100%; 
            left: 0;
            width: 100%;
            height: 100%; /* Matches the 50% height of its parent */
            background-color: #FFD700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Bottom text inside the grandchild */
        .bottom-text {
            margin: 0;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- Parent -->
    <div class="flag">
        <p class="top-text">The Flag</p>
        
        <!-- Child -->
        <div class="blue-stripe">
            
            <!-- Grandchild -->
            <div class="yellow-stripe">
                <p class="bottom-text">of Ukraine</p>
            </div>

        </div>
    </div>

</body>
</html>
